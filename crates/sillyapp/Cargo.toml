[package]
name = "sillyapp"
edition = "2024"

# "sillyapp" is a standalone program that runs the silly08 engine in a desktop window.
# The first argument can be a path to a Pico-8 cartridge that will be ran.
# This is mostly intended for development and testing purposes.

[dependencies]
sillyengine = { path = "../sillyengine" }
macroquad = { version = "0.4.16" }
